services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokedex_manager
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pokedex:${POSTGRES_PASSWORD:-pokedex}@database:5432/pokedex_manager?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
