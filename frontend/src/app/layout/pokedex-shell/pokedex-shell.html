<main class="pokedex-stage">
  <section class="pokedex" aria-label="Pokédex device">
    <header class="device-header" aria-hidden="true">
      <div class="lens"><span></span></div>
      <div class="status-light status-light--red"></div>
      <div class="status-light status-light--yellow"></div>
      <div class="status-light status-light--green"></div>
      <div class="speaker-slots"><i></i><i></i><i></i></div>
    </header>

    <div class="device-body">
      <div class="screen-bezel">
        <div class="screen-top" aria-hidden="true"><span></span><span></span></div>
        <div class="pokedex-screen">
          <div class="screen-grid" aria-hidden="true"></div>
          <div class="screen-content"><router-outlet /></div>
        </div>
        <div class="screen-bottom" aria-hidden="true">
          <span class="power-dot"></span>
          <span class="vents"><i></i><i></i><i></i><i></i></span>
        </div>
      </div>

      <div class="device-controls" aria-hidden="true">
        <div class="utility-buttons"><i></i><i></i></div>
        <div class="device-label">PKDX-01</div>
      </div>
    </div>
  </section>
</main>
